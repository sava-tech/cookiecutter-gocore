basePath: /api/v1
definitions:
  github_com_michaelassa01_blog_internal_users_dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_michaelassa01_blog_internal_users_dto.GetUserReq:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  github_com_michaelassa01_blog_internal_users_dto.GetUserRes:
    properties:
      age:
        type: integer
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      phone_number:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  github_com_michaelassa01_blog_internal_users_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_michaelassa01_blog_internal_users_dto.LoginResponse:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        type: string
      user:
        $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.RegisterResponse'
    type: object
  github_com_michaelassa01_blog_internal_users_dto.OtpEmailLoginReq:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  github_com_michaelassa01_blog_internal_users_dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_michaelassa01_blog_internal_users_dto.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 8
        type: string
      phone_number:
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - phone_number
    type: object
  github_com_michaelassa01_blog_internal_users_dto.RegisterResponse:
    properties:
      account_type:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      full_name:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
    type: object
  github_com_michaelassa01_blog_internal_users_dto.ResetPasswordRequest:
    properties:
      code:
        type: string
      email:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  github_com_michaelassa01_blog_internal_users_dto.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
      verification_type:
        type: string
    required:
    - code
    - email
    - verification_type
    type: object
  github_com_michaelassa01_blog_internal_users_dto.VerifyOtpEmailLoginReq:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  github_com_michaelassa01_blog_pkg_response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_michaelassa01_blog_pkg_response.Response:
    properties:
      data: {}
      error:
        type: string
      error_code:
        type: string
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Meta'
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@blog.com
    name: API Support
  description: This is the API documentation for blog.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: cnn-nigeria API
  version: "1.0"
paths:
  /account/get-account:
    get:
      consumes:
      - application/json
      description: Retrieve user account information
      parameters:
      - description: Get user account details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.GetUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: Account retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.GetUserRes'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Get user account
      tags:
      - Account
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiate forgot password process
      parameters:
      - description: Forgot password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: If your email is registered, you will receive a verification
            code
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Forgot password
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token
      parameters:
      - description: Login details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.LoginResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "403":
          description: Email not verified
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Login a user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user by invalidating the session
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "401":
          description: Invalid session ID format
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "500":
          description: Failed to logout
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Logout user
      tags:
      - Auth
  /auth/otp-email-login:
    post:
      consumes:
      - application/json
      description: Authenticate user using the registered email
      parameters:
      - description: Otp Email Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.OtpEmailLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Otp Email Login a user
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.RegisterResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "409":
          description: Email or phone already exists
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Register a new user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password with verification code
      parameters:
      - description: Reset password details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "404":
          description: Invalid or expired verification code
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Reset password
      tags:
      - Auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verify user email with verification code
      parameters:
      - description: Verification details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
        "404":
          description: Invalid or expired verification code
          schema:
            $ref: '#/definitions/github_com_michaelassa01_blog_pkg_response.Response'
      summary: Verify user email
      tags:
      - Auth
  /auth/verify-otp-email-login:
    post:
      consumes:
      - application/json
      description: Authenticate user using the registered email
      parameters:
      - description: Verify Otp Email Login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_michaelassa01_blog_internal_users_dto.VerifyOtpEmailLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: verify Otp Email Login a user
      tags:
      - Auth
  /social-auth/{provider}/callback:
    get:
      description: Handle OAuth callback and authenticate user
      parameters:
      - description: Provider (google, github)
        in: path
        name: provider
        required: true
        type: string
      responses: {}
      summary: OAuth Callback
      tags:
      - Auth
  /social-auth/{provider}/login:
    get:
      description: Redirect to provider's OAuth login page
      parameters:
      - description: Provider (google, apple)
        in: path
        name: provider
        required: true
        type: string
      responses: {}
      summary: Login with social provider
      tags:
      - Auth
securityDefinitions:
  ApiKeyAuth:
    description: Use your API key to authenticate requests.
    in: header
    name: api-access-key
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
