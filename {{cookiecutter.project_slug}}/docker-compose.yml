services:
  postgres:
    image: postgres:18-alpine3.24
    container_name: {{ cookiecutter.project_name }}_postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB={{ cookiecutter.project_name }}_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network

  redis:
    image: redis:8-alpine
    container_name: {{ cookiecutter.project_name }}_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  mailpit:
    # for local development, use the latest image from Docker Hub
    image: axllent/mailpit:latest
    container_name: {{ cookiecutter.project_name }}_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"  # SMTP - host:container
      - "127.0.0.1:8025:8025"  # Web UI
    volumes:
      - ./pkg/emailer/mailpit/data:/data
    environment:
      TZ: Africa/Lagos
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SMTP_IP: 0.0.0.0  # Listen on all interfaces inside container
    networks:
      - app-network

  api:
    container_name: {{ cookiecutter.project_name }}_api
    # platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      PRODUCTION: "false"
      DATABASE_URL: postgres://root:secret@postgres:5432/{{ cookiecutter.project_name }}_db?sslmode=disable
      REDIS_ADDRESS: redis:6379
      MAILPIT_HOST: mailpit  # This should be the service name
      MAILPIT_PORT: 1025
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
      - mailpit
    networks:
      - app-network

    entrypoint:
      [
        "wait-for.sh",
        "postgres:5432",
        "--",
        "wait-for.sh",
        "redis:6379",
        "--",
        "wait-for.sh",
        "mailpit:1025",
        "--",
        "start.sh",
      ]
    command: []

{%- if cookiecutter.use_microservices == 'y' %}
  reports:
    container_name: {{ cookiecutter.project_name }}_reports
    build:
      context: .
      dockerfile: Dockerfile.reports
    ports:
      - "8081:8081"
    env_file:
      - ./.env
    environment:
      SERVER_ADDRESS: 0.0.0.0:8081
      USERS_SERVICE_URL: http://api:8080
    depends_on:
      - api
    networks:
      - app-network

{% endif %}
volumes:
  postgres_data:
  redis_data:
  go_mod_cache:
  go_build_cache:

networks:
  app-network:
    driver: bridge
