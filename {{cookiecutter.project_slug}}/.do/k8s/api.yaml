apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # The deploy workflow replaces this with the image it just pushed
          image: api-image
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_ADDRESS
              value: "0.0.0.0:8080"
            - name: PRODUCTION
              value: "true"
            - name: GIN_MODE
              value: release
            - name: ACCESS_TOKEN_DURATION
              value: 15m
            - name: REFRESH_TOKEN_DURATION
              value: 720h
            - name: VERIFICATION_CODE_DURATION
              value: 10m
          # Created by the deploy workflow from GitHub secrets
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /public/health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /public/health
              port: 8080
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
