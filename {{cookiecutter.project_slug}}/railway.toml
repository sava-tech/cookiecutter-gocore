[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway provisions PostgreSQL as a separate plugin/service.
# Set DB_SOURCE and the other variables from env.example in the
# Railway dashboard (or `railway variables set`) — this file only
# controls how the service itself is built and run.
