name: Deploy to DigitalOcean Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys of the same branch at once
concurrency:
  group: deploy-{% raw %}${{ github.ref }}{% endraw %}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/api/main.go --parseDependency --parseInternal --output ./docs
      - run: go vet ./...
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: registry.digitalocean.com/{% raw %}${{ vars.DOCR_REGISTRY }}{% endraw %}/{{ cookiecutter.project_slug }}
      IMAGE_TAG: {% raw %}${{ github.sha }}{% endraw %}
    steps:
      - uses: actions/checkout@v7
      - uses: digitalocean/action-doctl@v2
        with:
          token: {% raw %}${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}{% endraw %}
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200
      - name: Build and push images
        run: |
          docker build -t "$IMAGE_PREFIX-api:$IMAGE_TAG" -f Dockerfile .
          docker push "$IMAGE_PREFIX-api:$IMAGE_TAG"
{%- if cookiecutter.use_microservices == 'y' %}
          docker build -t "$IMAGE_PREFIX-reports:$IMAGE_TAG" -f Dockerfile.reports .
          docker push "$IMAGE_PREFIX-reports:$IMAGE_TAG"
{%- endif %}
      - name: Connect to the cluster
        run: |
          doctl kubernetes cluster kubeconfig save --expiry-seconds 900 "{% raw %}${{ vars.DOKS_CLUSTER }}{% endraw %}"
          doctl kubernetes cluster registry add "{% raw %}${{ vars.DOKS_CLUSTER }}{% endraw %}"
      - name: Apply secrets
        env:
          DB_SOURCE: {% raw %}${{ secrets.DB_SOURCE }}{% endraw %}
          TOKEN_SYMMETRIC_KEY: {% raw %}${{ secrets.TOKEN_SYMMETRIC_KEY }}{% endraw %}
          SESSION_SECRET: {% raw %}${{ secrets.SESSION_SECRET }}{% endraw %}
          API_ACCESS_KEY: {% raw %}${{ secrets.API_ACCESS_KEY }}{% endraw %}
          SMTP_HOST: {% raw %}${{ secrets.SMTP_HOST }}{% endraw %}
          SMTP_PORT: {% raw %}${{ secrets.SMTP_PORT }}{% endraw %}
          SMTP_USERNAME: {% raw %}${{ secrets.SMTP_USERNAME }}{% endraw %}
          SMTP_PASSWORD: {% raw %}${{ secrets.SMTP_PASSWORD }}{% endraw %}
          DEFAULT_FROM_EMAIL: {% raw %}${{ secrets.DEFAULT_FROM_EMAIL }}{% endraw %}
        run: |
          kubectl apply -f .do/k8s/namespace.yaml
          kubectl create secret generic app-secrets \
            --namespace {{ cookiecutter.project_slug }} \
            --from-literal=DB_SOURCE="$DB_SOURCE" \
            --from-literal=TOKEN_SYMMETRIC_KEY="$TOKEN_SYMMETRIC_KEY" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --from-literal=API_ACCESS_KEY="$API_ACCESS_KEY" \
            --from-literal=EMAIL_PROVIDER=smtp \
            --from-literal=SMTP_HOST="$SMTP_HOST" \
            --from-literal=SMTP_PORT="$SMTP_PORT" \
            --from-literal=SMTP_USERNAME="$SMTP_USERNAME" \
            --from-literal=SMTP_PASSWORD="$SMTP_PASSWORD" \
            --from-literal=DEFAULT_FROM_EMAIL="$DEFAULT_FROM_EMAIL" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy
        working-directory: .do/k8s
        run: |
          kustomize edit set image api-image="$IMAGE_PREFIX-api:$IMAGE_TAG"
{%- if cookiecutter.use_microservices == 'y' %}
          kustomize edit set image reports-image="$IMAGE_PREFIX-reports:$IMAGE_TAG"
{%- endif %}
          kubectl apply -k .
          kubectl -n {{ cookiecutter.project_slug }} rollout status deployment/api --timeout=300s
{%- if cookiecutter.use_microservices == 'y' %}
          kubectl -n {{ cookiecutter.project_slug }} rollout status deployment/reports --timeout=300s
{%- endif %}
